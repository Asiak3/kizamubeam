# Deploys the static product website in website/ to GitHub Pages, together
# with the signed catalogue of extension packs (packs/*.kzp → catalog/) and the
# user manual (Docusaurus, manual/ → docs/).
# The generated HTML is committed, so no build is needed to deploy; the
# check step only makes sure it matches template.html + i18n/*.json.
# The catalogue is built and signed here with the secret PACKS_SIGNING_KEY
# (see scripts/catalog-keygen.mjs); without it the app ignores the catalogue.
# The manual is served under /kizamubeam/docs/. To host it elsewhere later
# (e.g. its own domain), set the repository variables DOCS_URL and
# DOCS_BASE_URL (see manual/docusaurus.config.ts) and deploy manual/build there.
#
# Webspace mirror: the same run also commits a ready-to-serve copy of the site
# (website + manual + catalogue, links pointing at WEBSPACE_URL) to the branch
# `webspace`. A web host that deploys with `git pull` checks out that branch and
# uses its website/ folder as document root; nothing has to be built there.
# The domain comes from the repository variable WEBSPACE_URL (default
# https://kizamubeam.com); set it to `off` to skip the mirror.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'manual/**'
      - 'packs/**'
      - 'src/packs.ts'
      - 'src/catalog.ts'
      - 'scripts/build-catalog.ts'
      - 'scripts/sign-catalog.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  # write: push the ready-built mirror to the `webspace` branch
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manual/package-lock.json

      - name: Check that the committed HTML is up to date
        run: |
          node website/build.mjs
          if ! git diff --quiet -- website; then
            echo "::error::website/ is out of date. Run 'node website/build.mjs' and commit the result."
            git --no-pager diff --stat -- website
            exit 1
          fi

      - name: Build and sign the extension catalogue
        env:
          PACKS_SIGNING_KEY: ${{ secrets.PACKS_SIGNING_KEY }}
        run: |
          npm ci
          node scripts/run-ts.mjs scripts/build-catalog.ts website/catalog
          node scripts/sign-catalog.mjs website/catalog/catalog.json

      - name: Build the user manual
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
        run: |
          npm ci --prefix manual
          npm run build --prefix manual

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r website/. _site/
          cp -r manual/build _site/docs

      - name: Build the webspace mirror
        id: webspace
        env:
          WEBSPACE_URL: ${{ vars.WEBSPACE_URL || 'https://kizamubeam.com' }}
        run: |
          if [ "$WEBSPACE_URL" = "off" ]; then
            echo "WEBSPACE_URL is 'off', skipping the webspace mirror."
            exit 0
          fi
          site="${WEBSPACE_URL%/}/"
          # The manual has to be built for its final address (baseUrl /docs/).
          DOCS_URL="${WEBSPACE_URL%/}" DOCS_BASE_URL=/docs/ WEBSITE_URL="$site" \
            npm run build --prefix manual -- --out-dir build-webspace
          mkdir -p _webspace/website
          cp -r website/. _webspace/website/
          cp -r manual/build-webspace _webspace/website/docs
          # Canonical links, sitemap, 404 page etc. point at the webspace domain.
          find _webspace/website -maxdepth 2 -type f \
            \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.webmanifest' \) \
            -not -path '_webspace/website/docs/*' \
            -exec sed -i "s#https://kizamubeam.github.io/kizamubeam/#${site}#g" {} +
          rm -f _webspace/website/README.md _webspace/website/build.mjs _webspace/website/template.html
          rm -rf _webspace/website/i18n
          cat > _webspace/README.md <<EOF
          # KizamuBeam website – webspace mirror

          Generated by .github/workflows/pages.yml from main ($GITHUB_SHA).
          Do not edit or open pull requests against this branch.

          Serve the \`website/\` folder as document root of ${site}.
          It contains the product website, the user manual (\`website/docs/\`)
          and the extension catalogue (\`website/catalog/\`).
          EOF
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push the webspace mirror
        if: steps.webspace.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Append a commit (no force push), so `git pull` on the web host
          # always fast-forwards.
          if git ls-remote --exit-code --heads origin webspace >/dev/null; then
            git fetch --depth=1 origin webspace
            git worktree add -B webspace _ws origin/webspace
          else
            git worktree add --orphan -b webspace _ws
          fi
          find _ws -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _webspace/. _ws/
          git -C _ws add -A
          if git -C _ws diff --cached --quiet; then
            echo "Webspace mirror unchanged."
          else
            git -C _ws commit -q -m "Update webspace mirror from ${GITHUB_SHA::7}"
            git -C _ws push origin webspace
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
