[package]
name = "kizamubeam"
version = "2.8.0"
description = "Freie Laser-Software (Prototyp)"
authors = ["Hanjo Winter"]
license = "GPL-3.0-or-later"
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "kizamubeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Updates aus den GitHub-Releases (siehe src/updater.rs)
tauri-plugin-updater = "2"
# Fenstergröße, -position und Maximiert-Zustand beim Beenden merken und beim Start wiederherstellen
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dirs = "7"
fontdb = "0.23"
# Google Fonts laden (src/fonts.rs); dieselben Bibliotheken wie im Updater, keine zusätzlichen Pakete
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
kizamubeam-core = { path = "core" }
# ohne libudev, damit unter Linux keine zusätzliche Systembibliothek nötig ist
serialport = { version = "4", default-features = false }
# WebSocket zur Steuerung (FluidNC Port 81), ohne TLS
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
ring = "0.17"

# Already used transitively by Tauri/Wry; expose only the Windows pinch setting,
# without enabling page-zoom hotkeys or changing other WebView defaults.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
