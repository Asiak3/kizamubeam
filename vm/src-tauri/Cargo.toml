[package]
name = "kizamubeam-vm"
version = "0.5.0"
description = "KizamuBeam Virtual Machine: virtuelle Lasermaschine (GRBL/FluidNC) zum Testen ohne Hardware"
authors = ["Hanjo Winter"]
license = "GPL-3.0-or-later"
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "kizamubeam_vm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
kizamubeam-vm-core = { path = "core" }
