[package]
name = "kzb-hole-plate"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "KizamuBeam example plugin (WebAssembly): plate with a pattern of holes"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kzb-plugin = { path = "../sdk/rust" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
